name: Build Marawis Smpn99 Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter web preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --platforms=web --project-name marawis_smpn99 .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib

      - name: Run tests
        run: flutter test

      - name: Build release website
        run: flutter build web --release --base-href "/marawis-smpn99-app./"

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: marawis-smpn99-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 7
