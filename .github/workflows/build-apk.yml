name: Build Marawis Smpn99 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name marawis_smpn99 .

      - name: Pin Android Gradle Plugin to lint-fixed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_path = Path("android/settings.gradle.kts")
          settings = settings_path.read_text()
          pattern = r'(id\("com\.android\.application"\)\s+version\s+")([^"]+)("\s+apply false)'
          match = re.search(pattern, settings)
          if match is None:
              raise SystemExit("Plugin com.android.application version was not found exactly once; refusing to guess.")

          version_text = match.group(2)
          version_match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version_text)
          if version_match is None:
              raise SystemExit(f"Unexpected Android Gradle Plugin version format: {version_text}")

          version = tuple(map(int, version_match.groups()))
          if version in ((9, 3, 0), (9, 3, 1)):
              settings = settings[:match.start(2)] + "9.3.2" + settings[match.end(2):]
              settings_path.write_text(settings)
              print(f"Updated Android Gradle Plugin {version_text} -> 9.3.2 (fixes the AGP 9.3 lint crash).")
          elif version >= (9, 3, 2):
              print(f"Android Gradle Plugin {version_text} already includes the AGP 9.3 lint fix; no change needed.")
          else:
              raise SystemExit(
                  f"Android Gradle Plugin {version_text} predates the known lint fix. "
                  "Review Flutter/AGP compatibility before changing versions."
              )
          PY

      - name: Configure Supabase OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          marker = 'android:scheme="marawissmpn99"'
          # Ensure Flutter reuses the existing MainActivity when the OAuth
          # callback returns to the running application.
          content = content.replace(
              'android:name=".MainActivity"',
              'android:name=".MainActivity" android:launchMode="singleTop"',
              1,
          ) if 'android:name=".MainActivity"' in content and 'android:launchMode=' not in content.split('android:name=".MainActivity"', 1)[1].split('>', 1)[0] else content
          if marker not in content:
              intent_filter = """
                  <intent-filter android:label="supabase_auth">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="marawissmpn99" android:host="login-callback" />
                  </intent-filter>
              """
              content = content.replace("</activity>", intent_filter + "\n        </activity>", 1)
          path.write_text(content)
          PY

      - name: Verify Android OAuth callback
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = ET.parse(Path("android/app/src/main/AndroidManifest.xml")).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activities = manifest.findall(".//activity")
          main_activity = next(
              (item for item in activities if item.get(android + "name") == ".MainActivity"),
              None,
          )
          assert main_activity is not None, "MainActivity tidak ditemukan"
          assert main_activity.get(android + "launchMode") == "singleTop", "MainActivity harus memakai launchMode singleTop"

          callback_found = False
          for intent_filter in main_activity.findall("intent-filter"):
              for data in intent_filter.findall("data"):
                  if data.get(android + "scheme") == "marawissmpn99" and data.get(android + "host") == "login-callback":
                      callback_found = True
          assert callback_found, "Intent filter marawissmpn99://login-callback tidak terpasang pada MainActivity"
          print("OAuth callback Android terverifikasi: marawissmpn99://login-callback")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib

      - name: Run tests
        run: flutter test

      - name: Configure APK signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()
          release_block = "    release {"
          if release_block not in content:
              raise SystemExit("Blok buildTypes.release tidak ditemukan; APK tidak akan dibangun tanpa konfigurasi signing.")
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in content:
              content = content.replace(
                  release_block,
                  release_block + '\n            signingConfig = signingConfigs.getByName("debug")',
                  1,
              )
          path.write_text(content)
          print("Release APK akan ditandatangani menggunakan debug keystore untuk pengujian.")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marawis-smpn99-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
