name: Build Marawis Smpn99 APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name marawis_smpn99 .

      - name: Pin Android Gradle Plugin to lint-fixed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_path = Path("android/settings.gradle.kts")
          settings = settings_path.read_text()
          pattern = r'(id\("com\.android\.application"\)\s+version\s+")([^"]+)("\s+apply false)'
          match = re.search(pattern, settings)
          if match is None:
              raise SystemExit("Plugin com.android.application version was not found exactly once; refusing to guess.")

          version_text = match.group(2)
          version_match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version_text)
          if version_match is None:
              raise SystemExit(f"Unexpected Android Gradle Plugin version format: {version_text}")

          version = tuple(map(int, version_match.groups()))
          if version in ((9, 3, 0), (9, 3, 1)):
              settings = settings[:match.start(2)] + "9.3.2" + settings[match.end(2):]
              settings_path.write_text(settings)
              print(f"Updated Android Gradle Plugin {version_text} -> 9.3.2 (fixes the AGP 9.3 lint crash).")
          elif version >= (9, 3, 2):
              print(f"Android Gradle Plugin {version_text} already includes the AGP 9.3 lint fix; no change needed.")
          else:
              raise SystemExit(
                  f"Android Gradle Plugin {version_text} predates the known lint fix. "
                  "Review Flutter/AGP compatibility before changing versions."
              )
          PY

      - name: Configure Supabase OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          marker = 'android:scheme="marawissmpn99"'
          # Ensure Flutter reuses the existing MainActivity when the OAuth
          # callback returns to the running application.
          content = content.replace(
              'android:name=".MainActivity"',
              'android:name=".MainActivity" android:launchMode="singleTop"',
              1,
          ) if 'android:name=".MainActivity"' in content and 'android:launchMode=' not in content.split('android:name=".MainActivity"', 1)[1].split('>', 1)[0] else content
          if marker not in content:
              intent_filter = """
                  <intent-filter android:label="supabase_auth">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="marawissmpn99" android:host="login-callback" />
                  </intent-filter>
              """
              content = content.replace("</activity>", intent_filter + "\n        </activity>", 1)
          path.write_text(content)
          PY

      - name: Verify Android OAuth callback
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = ET.parse(Path("android/app/src/main/AndroidManifest.xml")).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activities = manifest.findall(".//activity")
          main_activity = next(
              (item for item in activities if item.get(android + "name") == ".MainActivity"),
              None,
          )
          assert main_activity is not None, "MainActivity tidak ditemukan"
          assert main_activity.get(android + "launchMode") == "singleTop", "MainActivity harus memakai launchMode singleTop"

          callback_found = False
          for intent_filter in main_activity.findall("intent-filter"):
              for data in intent_filter.findall("data"):
                  if data.get(android + "scheme") == "marawissmpn99" and data.get(android + "host") == "login-callback":
                      callback_found = True
          assert callback_found, "Intent filter marawissmpn99://login-callback tidak terpasang pada MainActivity"
          print("OAuth callback Android terverifikasi: marawissmpn99://login-callback")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Release signing is not configured. Add these GitHub Actions secrets: "
                  + ", ".join(missing)
              )

          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          try:
              keystore = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64.") from error
          if len(keystore) < 1024:
              raise SystemExit("The decoded Android keystore is unexpectedly small.")

          keystore_path = Path("android/app/upload-keystore.jks")
          keystore_path.write_bytes(keystore)
          subprocess.run(
              [
                  "keytool", "-list", "-keystore", str(keystore_path),
                  "-storepass:env", "ANDROID_KEYSTORE_PASSWORD",
                  "-alias", os.environ["ANDROID_KEY_ALIAS"],
              ],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
              text=True,
          )

          gradle_path = Path("android/app/build.gradle.kts")
          content = gradle_path.read_text()
          signing_block = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            storeFile = file(\"upload-keystore.jks\")\n"
              "            storePassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias = System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword = System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n\n"
          )
          if 'create("release")' not in content:
              marker = "    buildTypes {"
              if marker not in content:
                  raise SystemExit("Blok buildTypes tidak ditemukan; signing tidak akan ditebak.")
              content = content.replace(marker, signing_block + marker, 1)

          debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          release_signing = 'signingConfig = signingConfigs.getByName("release")'
          if debug_signing in content:
              content = content.replace(debug_signing, release_signing, 1)
          elif release_signing not in content:
              raise SystemExit("Konfigurasi signing release tidak ditemukan setelah patch.")

          gradle_path.write_text(content)
          print("Release keystore tervalidasi dan signing release dikonfigurasi.")
          PY

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signature and Android compatibility
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT" && test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 8
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marawis-smpn99-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove release signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks
